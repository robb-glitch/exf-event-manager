<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1C1C"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="/shim.js"></script></head><body>
<title>ExF Event Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column manifest under a hazard-stripe masthead; fixed yard-gate tab bar with a raised yellow SCAN block. */
:root{
  --paper:#E6EAE6; --card:#F5F7F4; --field:#FFFFFF; --ink:#0F1C1C; --muted:#52615F; --line:#C3CBC6;
  --signal:#F2B600; --signal-ink:#1B1500; --steel:#1D5A55; --ok:#1F7A4B; --bad:#B3261E;
  --bar:#0F1C1C; --bar-fg:#E6EAE6; --stripe-b:#0F1C1C;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1514; --card:#142120; --field:#0F1B1A; --ink:#E7EDE8; --muted:#92A5A1; --line:#27403D;
    --steel:#5FB8AE; --ok:#58C48C; --bad:#FF8A80; --bar:#050A0A; --bar-fg:#E7EDE8; --stripe-b:#050A0A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1514; --card:#142120; --field:#0F1B1A; --ink:#E7EDE8; --muted:#92A5A1; --line:#27403D;
  --steel:#5FB8AE; --ok:#58C48C; --bad:#FF8A80; --bar:#050A0A; --bar-fg:#E7EDE8; --stripe-b:#050A0A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 130px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

/* masthead */
.mast{padding-top:16px}
.kicker{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kicker .right{display:flex;align-items:center;gap:10px}
.savefab{position:fixed;right:12px;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;border:3px solid var(--ink);border-radius:2px;background:var(--signal);color:var(--signal-ink);font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:20px;letter-spacing:.04em;padding:10px 20px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.savefab.err{background:var(--bad);color:#fff}
.savefab[hidden]{display:none}
.savestate{min-width:5.5em;text-align:right;letter-spacing:.06em}
.savestate.err{color:var(--bad)}
.evsel{position:relative;display:block;margin-top:8px}
.evname{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(44px,13vw,88px);line-height:.88;letter-spacing:-.005em;text-wrap:balance;overflow-wrap:anywhere}
.evname::after{content:"▾";font-size:.4em;vertical-align:.5em;margin-left:.2em;color:var(--muted)}
.evsel{cursor:pointer}
.kl{display:flex;align-items:center;gap:10px}
.evmeta{margin-top:8px;font-family:var(--mono);font-size:13px;color:var(--muted);min-height:1.4em}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px}
.stat{display:flex;align-items:baseline;gap:7px}
.stat b{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stripe{height:10px;margin-top:14px;background:repeating-linear-gradient(-45deg,var(--signal) 0 10px,var(--stripe-b) 10px 20px)}

/* buttons, chips */
.btn{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:16px;line-height:1;padding:11px 16px;min-height:44px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.signal{background:var(--signal);color:var(--signal-ink)}
.btn.signal:hover{background:var(--signal);color:var(--signal-ink);filter:brightness(.94)}
.btn.small{font-size:13px;padding:7px 10px;min-height:34px;border-width:1.5px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;min-height:34px;border:1.5px solid var(--line);background:transparent;border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip b{font-weight:500;margin-left:4px;opacity:.75}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.toolbar .grow{flex:1}

/* inputs */
.in{width:100%;min-width:0;padding:10px 12px;min-height:44px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:2px;font:inherit;font-size:16px}
.in:focus{outline:none;border-color:var(--ink)}
textarea.in{resize:vertical;line-height:1.5}
.search{margin-top:16px;font-size:17px;border-color:var(--ink);border-width:2px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sec{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:.05em;border-bottom:2px solid var(--ink);padding-bottom:4px;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;color:var(--muted)}

/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:2px;cursor:pointer}
.row:hover{border-color:var(--ink)}
.thumb{width:76px;height:50px;object-fit:cover;border:1px solid var(--line);background:var(--field);display:block}
.thumb.ph{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;color:var(--muted)}
.co{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:23px;line-height:1;letter-spacing:.01em;overflow-wrap:anywhere}
.nm{font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.seq{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border:1.5px solid var(--line);border-radius:2px;white-space:nowrap}
.pill.check{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.pill.follow{border-color:var(--steel);color:var(--steel)}
.pill.done{border-color:var(--ok);color:var(--ok)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.now{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.evtag{font-family:var(--mono);font-size:11px;color:var(--muted)}
.row.reading{cursor:default;border-style:dashed}
.bar{height:6px;background:var(--line);overflow:hidden;margin-top:8px;position:relative}
.bar::after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:var(--signal);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.empty{border:2px dashed var(--line);padding:26px 18px;text-align:left}
.empty h3{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.95;margin:0 0 8px;text-wrap:balance}
.empty p{margin:0 0 14px;max-width:52ch}

/* meetings */
.day{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.05em;margin:18px 0 8px;display:flex;gap:10px;align-items:baseline}
.day.today::after{content:"TODAY";font-family:var(--mono);font-size:11px;letter-spacing:.12em;background:var(--signal);color:var(--signal-ink);padding:2px 6px}
.mrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:2px;cursor:pointer}
.mrow:hover{border-color:var(--ink)}
.mtime{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mtime b{display:block;font-size:20px;font-weight:500;line-height:1.1}
.mtime span{font-size:12px;color:var(--muted)}
.mrow.missed .co,.mrow.done .co{opacity:.55}

/* detail pages */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 12px}
.bigname{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(34px,9vw,58px);line-height:.92;text-wrap:balance;overflow-wrap:anywhere}
.bigsub{margin-top:6px;color:var(--muted)}
.cardimg{display:block;width:100%;max-height:340px;object-fit:contain;background:var(--field);border:1px solid var(--line);margin:14px 0}
.banner{background:var(--signal);color:var(--signal-ink);padding:12px 14px;margin:14px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.banner p{margin:2px 0 0;font-size:14px}
.banner .btn{border-color:var(--signal-ink);color:var(--signal-ink)}
.banner .btn:hover{background:var(--signal-ink);color:var(--signal)}
.seg{display:flex;flex-wrap:wrap;gap:0;margin:14px 0}
.seg button{flex:1;min-width:96px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:16px;padding:11px 8px;min-height:44px;border:2px solid var(--ink);margin-left:-2px;background:transparent;cursor:pointer}
.seg button:first-child{margin-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.notes{min-height:42vh}
details.raw{margin-top:14px}
details.raw summary{cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 0}

/* tasks + attachments */
.tasks .task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .due{font-family:var(--mono);font-size:12px;color:var(--muted)}
.task .due.late{color:var(--bad)}
.addtask{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;margin-top:10px}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0}
.att .it{border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-width:0}
.att .it img{width:100%;height:96px;object-fit:cover;display:block}
.att .it .doc{height:96px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;color:var(--muted)}
.att .meta{padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.att .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.att .meta button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;padding:4px;min-height:28px}
.att .meta button.danger{color:var(--bad);font-weight:700}
.uprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* sheet, toast */
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,10,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:680px;max-height:90%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:8px solid var(--signal)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.95;margin:0}
.opt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--ink);background:var(--card);cursor:pointer;margin-bottom:10px;border-radius:2px}
.opt b{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.04em}
.opt span{color:var(--muted);font-size:13px}
.opt:hover{background:var(--ink);color:var(--paper)}
.opt:hover span{color:var(--paper)}
.pick{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.pick input{width:22px;height:22px;margin-top:2px;accent-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:11px 15px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}

/* nav row + launch dock */
.nav{display:flex;gap:4px;margin-top:10px}
.navtab{flex:1;background:none;border:0;border-bottom:3px solid var(--line);font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:18px;padding:10px 4px 8px;min-height:44px;cursor:pointer;color:var(--muted)}
.navtab[aria-current="page"]{border-bottom-color:var(--ink);color:var(--ink)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);color:var(--bar-fg);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:756px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.launch{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:66px;padding:8px 14px;border:2px solid var(--bar-fg);border-radius:2px;cursor:pointer;text-align:left}
.launch b{font-family:var(--display);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.launch span{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.launch.scan{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.launch.note{background:var(--bar-fg);color:var(--bar)}
.launch:active{transform:translateY(1px)}
body.compact .stats,body.compact .evmeta,body.compact .nav{display:none}
body.compact .evname{font-size:26px;line-height:1}
body.compact .evname::after{font-size:.8em}
body.compact .stripe{margin-top:10px}
.bigbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}
.bigbtns .btn{min-height:88px;font-size:28px}
/* event home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}
.tile{background:var(--bar);color:var(--bar-fg);padding:14px 16px;cursor:pointer;border:2px solid var(--bar);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.tile:hover{border-color:var(--signal)}
.tl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.tn{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.tn b{font-family:var(--display);font-weight:900;font-size:84px;line-height:.85;color:var(--signal);font-variant-numeric:tabular-nums}
.tn span{font-family:var(--display);font-weight:800;font-size:32px;opacity:.7}
.meter{height:8px;background:rgba(255,255,255,.18);margin:12px 0 8px}
.meter i{display:block;height:100%;background:var(--signal)}
.ts{font-size:13px;opacity:.85}
.fuRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:2px;cursor:pointer}
.fuRow:hover{border-color:var(--ink)}
.evrow{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);gap:14px;align-items:baseline;padding:10px;background:var(--card);border:1px solid var(--line);font-family:var(--mono);font-size:13px}
.evrow b{font-family:var(--display);font-size:20px;text-transform:uppercase;font-weight:800;overflow-wrap:anywhere}
.fu-box{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid var(--ink);padding:12px 14px;margin:14px 0}
.fu-box b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;display:block}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
body.hub .stats{display:none}
body.onhome .evsel,body.onhome .evmeta,body.onhome .stats,body.onhome .nav,body.pick .evsel,body.pick .evmeta,body.pick .stats,body.pick .nav{display:none}
body.onhome #homeBtn{display:none}
body .brand{display:none}
.pill.shared{border-color:var(--steel);color:var(--steel)}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.prow .pn b{font-family:var(--display);font-size:22px;text-transform:uppercase;font-weight:800;display:block}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:var(--line)}
.sharenote{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--steel);color:var(--steel);padding:8px 10px;margin:10px 0}
.icobtn,.appshare{background:none;border:0;color:var(--muted);padding:8px;min-width:40px;min-height:40px;cursor:pointer;opacity:.7;border-radius:2px;display:inline-flex;align-items:center;justify-content:center}
.icobtn:hover,.appshare:hover{opacity:1;color:var(--ink)}
.icobtn{position:relative}
.icobtn.todo::after{content:'';position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--signal);border:1.5px solid var(--paper)}
body:not(.onhome) .appshare{display:none}
.logo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:6px 0;margin-top:6px}
.logo img{display:block}
.logo .lw{height:40px;width:auto}
.logo .lg{height:42px;width:auto}
.logo .lt{flex-basis:100%;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(24px,8vw,34px);line-height:.9;color:var(--ink);letter-spacing:.01em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .lw{filter:brightness(1.7) saturate(1.15)}:root:not([data-theme="light"]) .logo .lg{filter:brightness(1.15)}}
:root[data-theme="dark"] .logo .lw{filter:brightness(1.7) saturate(1.15)}
:root[data-theme="dark"] .logo .lg{filter:brightness(1.15)}
.dirrow{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.dirrow:hover{border-color:var(--ink)}
.dcb{width:22px;height:22px;flex:none;accent-color:var(--ink);margin:0}
.dthumb{width:38px;height:38px;object-fit:cover;flex:none;border-radius:2px;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.dmain{flex:1;min-width:0}
.dn{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:20px;line-height:1.05;overflow-wrap:anywhere}
.ds{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.launcher{display:grid;gap:8px;margin-top:12px}
.lbtn{display:block;width:100%;text-align:left;border:3px solid var(--ink);border-radius:2px;background:var(--card);color:var(--ink);padding:10px 16px;min-height:60px;display:flex;align-items:center;cursor:pointer}
.lbtn b{display:block;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,10vw,42px);line-height:.9}
.lbtn span{display:none;margin-top:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.lbtn.long b{font-size:clamp(26px,8.2vw,36px);line-height:.95}
.lbtn.scan{background:var(--signal);color:var(--signal-ink)}
.lbtn.note{background:var(--bar);color:var(--bar-fg)}
.ecard{display:block;border:2px solid var(--ink);background:var(--card);padding:14px 16px;cursor:pointer}
.ecard .co{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.95;overflow-wrap:anywhere}
.ecard .st{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ecard .pills{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.bar::after{animation:none;width:100%}}
@media (max-width:480px){.addtask{grid-template-columns:minmax(0,1fr) auto}.addtask .due{grid-column:1/2}}
</style>

  ['firstName','First name'],['lastName','Last name'],['title','Job title'],['department','Department'],['company','Company'],
  ['email','Email'],['email2','Email 2'],['phone','Office phone'],['mobile','Mobile'],['fax','Fax'],['messaging','WeChat / WhatsApp'],['website','Website'],['linkedin','LinkedIn'],
  ['address','Street address'],['city','City'],['region','State / region'],['postal','Postal code'],['country','Country'],
  ['services','Services & modes'],['affiliations','Networks & memberships']
];
const NETS=['IATA','WCA','NAP','AERO','Ox','Other'];
const NET_RX={IATA:/\bIATA\b/i,WCA:/\bWCA\b/i,NAP:/\bNAP\b/i,AERO:/\bAERO\b/i,Ox:/\bOx\b|\bOX\b/};
function guessNets(text){
  const t=String(text||'');
  return {networks:Object.keys(NET_RX).filter(k=>NET_RX[k].test(t)),networkOther:''};
}
function autoOther(text){
  return String(text||'').split(/[,;|\n•]+/).map(x=>x.trim()).filter(x=>x&&!Object.values(NET_RX).some(r=>r.test(x))).join(', ');
}
const GROUPS=[
  ['Who',['firstName','lastName','title','department','company']],
  ['Reach',['email','email2','phone','mobile','fax','messaging','website','linkedin']],
  ['Where',['address','city','region','postal','country']],
  ['Freight',['services']]
];
const INPUTMODE={email:'email',email2:'email',phone:'tel',mobile:'tel',fax:'tel',website:'url',linkedin:'url'};
const STATUS=[['new','New'],['follow-up','Follow up'],['done','Done']];
const MSTATUS=[['scheduled','Scheduled'],['done','Done'],['missed','No-show']];
const CARD_PROMPT='You are reading a photo of a business card (or both sides of one) collected at a freight forwarding and logistics trade event. Return ONLY one JSON object with exactly these string keys: firstName, lastName, title, department, company, email, email2, phone, mobile, fax, messaging, website, linkedin, address, city, region, postal, country, services, affiliations, rawText, confidence.\nRules: copy text exactly as printed and never guess or invent. Use "" for anything not on the card. Keep phone, mobile and fax numbers as printed, with country code. messaging = WeChat, WhatsApp, Skype or Telegram handles, with the app name. services = freight modes or services the card lists (air, ocean, road, customs, warehousing and so on). affiliations = network or certification names and logos (IATA, FIATA, WCA, JCtrans, TAPA, ISO and so on). rawText = every line of text on the card in reading order, joined with newlines. If the name is in a non-Latin script, put the Latin spelling in firstName and lastName when it is printed, and keep the original script in rawText. confidence = "high", "medium" or "low" for how legible the card was. If the image is not a business card, return every key as "" with confidence "low".';

/* ---------- helpers ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nowHM(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtDate(s){if(!s)return 'No date';const p=s.split('-').map(Number);if(!p[0])return s;return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function dateSpan(e){if(!e)return '';if(e.startDate&&e.endDate&&e.startDate!==e.endDate)return fmtDate(e.startDate)+' – '+fmtDate(e.endDate);return e.startDate?fmtDate(e.startDate):''}
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='for')el.setAttribute('for',v);
    else if(k in el&&k!=='list'&&k!=='form'){try{el[k]=v}catch(e){el.setAttribute(k,v)}}
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(String(kid)))}
  return el;
}
function clickable(el,fn){el.setAttribute('role','button');el.tabIndex=0;el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.target!==el)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});return el}
function select(options,value,onchange){const s=h('select',{class:'in',onchange:e=>onchange(e.target.value)},options.map(o=>h('option',{value:o[0],text:o[1]})));s.value=value;return s}
function fullName(c){return [c.firstName,c.lastName].filter(Boolean).join(' ')}
function initials(c){const s=((c.firstName||'')[0]||'')+((c.lastName||'')[0]||'');return (s||(c.company||'?')[0]||'?').toUpperCase()}
function cardOf(c){return (c.attachments||[]).find(a=>a.kind==='card')}
function selfieOf(c){const l=(c.attachments||[]).filter(a=>a.kind==='selfie');return l[l.length-1]}
function thumbOf(c){return selfieOf(c)||cardOf(c)}
function selfieFor(c){
  if(!c){toast('Scan a card first, then take the selfie.');return}
  const inp=h('input',{type:'file',accept:'image/*',capture:'user',hidden:true});
  document.body.append(inp);
  inp.addEventListener('change',async()=>{
    const f=inp.files&&inp.files[0];inp.remove();if(!f)return;
    try{
      toast('Saving selfie…');
      const up=await uploadFile(f,'selfie');
      const cur=S.contacts.find(x=>x.id===c.id)||c;
      save('contacts',c.id,{attachments:(cur.attachments||[]).concat([up.att])},{now:true});
      toast('Selfie added');
    }catch(e){toast('Could not save the selfie. '+errMsg(e))}
  });
  inp.click();
}
function slug(s){return String(s||'all').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'all'}
function evName(id){const e=S.events.find(x=>x.id===id);return e?e.name:''}
let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},5000)}
function errMsg(e){
  const c=e&&e.code;
  if(c==='not_granted')return 'Claude access was declined for this page.';
  if(c==='rate_limited')return 'Claude usage limit reached. Try again later.';
  if(c==='invalid_json')return 'The card text could not be parsed.';
  if(c==='image_rejected'||c==='unsupported_type')return 'That file type is not supported. Use JPG, PNG, WebP, PDF, CSV, Markdown or text.';
  if(c==='too_large')return 'That file is too large (20 MB limit).';
  if(c==='quota_or_state')return 'Storage is full or unavailable.';
  return (e&&e.message)||'Unknown error.';
}
function arm(btn,label,armed,fn){
  let t;btn.textContent=label;
  btn.addEventListener('click',()=>{
    if(btn.dataset.armed){clearTimeout(t);delete btn.dataset.armed;btn.textContent=label;btn.classList.remove('danger');fn()}
    else{btn.dataset.armed='1';btn.textContent=armed;btn.classList.add('danger');t=setTimeout(()=>{delete btn.dataset.armed;btn.textContent=label;btn.classList.remove('danger')},3500)}
  });
  return btn;
}
function copyBtn(label,text){
  return h('button',{class:'btn small',text:'Copy '+label,onclick:async e=>{
    try{await navigator.clipboard.writeText(text);toast('Copied '+text)}catch(err){
      const t=h('input',{class:'in',value:text,readOnly:true});e.target.after(t);t.select();toast('Select and copy the text')}

function save(col,id,patch,opts){
  if(!S.db)return Promise.resolve();
  const key=col+'/'+id;
  let w=writers.get(key);
  if(!w){w={patch:{},timer:null,chain:Promise.resolve()};writers.set(key,w);w.run=()=>{
    w.timer=null;
    const p=w.patch;w.patch={};
    if(!Object.keys(p).length)return w.chain;
    p.updatedAt=Date.now();
    w.chain=w.chain.then(()=>S.db.doc(key).update(p)).then(()=>{if(!Object.keys(w.patch).length)setSaveState('saved')}).catch(e=>{setSaveState('error');toast('Could not save: '+errMsg(e))});

  }}

}

async function shrink(file,max,q){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*k),hh=Math.round(bmp.height*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
    cv.getContext('2d').drawImage(bmp,0,0,w,hh);if(bmp.close)bmp.close();
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q||0.86));
    return blob&&blob.size?blob:file;
  }catch(e){return file}
}
const DB_FILE_MAX=175000;
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function uploadFile(file,kind){
  let blob=file,type=file.type;
  const isImg=type.startsWith('image/');
  if(isImg){blob=await shrink(file,1800);type=blob.type||'image/jpeg'}
  else{
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    type={pdf:'application/pdf',csv:'text/csv',md:'text/markdown',txt:'text/plain',json:'application/json'}[ext];
    if(!type)throw {code:'unsupported_type',message:'That file type is not supported.'};
  }
  const name=file.name||('photo-'+Date.now()+'.jpg');
  if(S.assets){
    const res=await S.assets.upload(blob,{type});
    return {att:{id:res.id,name,type:res.contentType||type,kind:kind||(isImg?'photo':'doc'),at:Date.now()},blob};
  }
  /* no asset access: keep the file in the shared database instead (small files only) */
  let store=blob;
  if(isImg){
    for(const [dim,q] of [[1400,0.78],[1100,0.72],[900,0.66],[700,0.6]]){store=await shrink(file,dim,q);if(store.size<=DB_FILE_MAX)break}
  }
  if(store.size>DB_FILE_MAX)throw {code:'too_large',message:'That file is too large to store ('+Math.round(store.size/1024)+' KB, limit '+Math.round(DB_FILE_MAX/1024)+' KB).'};
  const ref=S.db.collection('files').doc();
  const data=await blobToDataUrl(store);
  await ref.set({data,type,name,ownerId:S.me.id||'',createdAt:Date.now()});
  S.fileCache[ref.id]=Promise.resolve(data);
  return {att:{id:ref.id,db:true,name,type,kind:kind||(isImg?'photo':'doc'),at:Date.now()},blob};
}
function fileData(att){
  if(!S.fileCache[att.id])S.fileCache[att.id]=S.db.doc('files/'+att.id).get().then(snap=>snap.exists?snap.data().data:'').catch(()=>{delete S.fileCache[att.id];return ''});
  return S.fileCache[att.id];
}

function exportMeetings(){
  const header=['Event','Owner','Date','Start','End','Location','Company','Person','Role','Status','Notes','Action items','Attachments'];
  const rows=S.meetings.filter(inScope).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||'')).map(m=>
    [evName(m.eventId),ownerLabel(m),m.date,m.start,m.end,m.location,m.company,m.contactName,m.contactTitle,m.status,m.notes,(m.tasks||[]).map(t=>(t.done?'[x] ':'[ ] ')+t.text).join(' | '),(m.attachments||[]).length]);
  const a=activeEvent();
  return saveFile('meetings-'+slug(S.eventId==='all'?'all-events':a&&a.name)+'-'+todayStr()+'.csv',csv(header,rows));
}
function exportBackup(){
  return saveFile('card-desk-backup-'+todayStr()+'.json',JSON.stringify({exportedAt:new Date().toISOString(),events:S.events,contacts:S.contacts,meetings:S.meetings},null,2));
}
$('#exportBtn').addEventListener('click',()=>{
  openSheet('Export',close=>{
    const scope=S.eventId==='all'?'all events':'this event';
    const opt=(t,d,fn)=>h('button',{class:'opt',onclick:()=>{close();fn()}},h('b',{text:t}),h('span',{text:d}));
    return h('div',{},
      opt('Contacts · CSV','Every field, tags, notes, follow-ups and card text for '+scope+'. Opens in Excel.',exportContacts),
      opt('Meetings · CSV','Schedule, notes and action items for '+scope+'.',exportMeetings),
      opt('Full backup · JSON','All events, contacts and meetings.',exportBackup),
      S.downloads?null:h('p',{class:'muted',text:'Downloads are not available in this view.'}));
  });
});

function effTheme(){const t=document.documentElement.dataset.theme;if(t==='light'||t==='dark')return t;return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function paintTheme(){const d=effTheme()==='dark';$('#icoSun').style.display=d?'':'none';$('#icoMoon').style.display=d?'none':'';}
function applyTheme(t){document.documentElement.dataset.theme=t;lsSet('xc.theme',t);paintTheme()}
{const saved=lsGet('xc.theme');if(saved==='light'||saved==='dark')document.documentElement.dataset.theme=saved;paintTheme()}

const APP_URL=location.origin+'/';
$('#appShare').addEventListener('click',()=>{
  const msg='Join me on ExF Event Manager App. Scan cards, take meeting notes and share contacts in one place: '+APP_URL;
  const enc=encodeURIComponent(msg);
  openSheet('Share the app',()=>{
    const cp=h('button',{class:'btn',text:'🔗 Copy link',onclick:async()=>{
      try{await navigator.clipboard.writeText(msg);toast('Copied')}
      catch(e){const t=h('textarea',{value:msg,style:{position:'fixed',opacity:'0'}});document.body.append(t);t.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Could not copy')}t.remove()}
    }});
    return h('div',{},
      h('p',{class:'muted',text:msg}),
      h('div',{class:'toolbar'},cp,h('a',{class:'btn',href:'https://wa.me/?text='+enc,target:'_blank',rel:'noopener',text:'💬 WhatsApp'}),h('a',{class:'btn',href:'mailto:?subject='+encodeURIComponent('ExF Event Manager')+'&body='+enc,target:'_blank',rel:'noopener',text:'✉️ Email'})),
      h('p',{class:'muted mono',text:'Colleagues sign in with the team access code. Once they open the app they appear in your Share list.'}));
  });
});

async function init(){
  renderMain();
  const c=window.claude;
  if(!c||!c.use){main.replaceChildren(h('div',{class:'empty',style:{marginTop:'20px'}},h('h3',{text:'Could not start'}),h('p',{text:'Reload the page. If it keeps happening, sign out and sign in again.'})));return}
  const get=n=>c.use(n).catch(()=>null);
  const r=await Promise.all([get('db'),get('assets'),get('sample'),get('downloads'),get('user')]);
  S.db=r[0];S.assets=r[1];S.sample=r[2];S.downloads=r[3];S.u=r[4];
  if(!S.db){main.replaceChildren(h('div',{class:'empty',style:{marginTop:'20px'}},h('h3',{text:'Sign in to continue'}),h('p',{text:'Storage is unavailable. Reload the page or sign in again.'})));return}
  if(S.u){
    try{const me=await S.u.me();S.me={id:me.id||null,name:me.name||''};S.isOwner=!!me.isOwner;if(me.id){S.names[me.id]=me.name||'';S.avatars[me.id]=me.avatarUrl}}catch(e){}
  }
  if(S.me.id){
    const ref=S.db.doc('users/'+S.me.id);let first=true;
    ref.onSnapshot(snap=>{
      S.myDefault=snap.exists?(snap.data().defaultEvent||''):'';
      if(snap.exists&&snap.data().prof){S.prof=snap.data().prof}
      paintMe();
      if(first){first=false;(snap.exists?ref.update({seenAt:Date.now()}):ref.set({seenAt:Date.now()})).catch(()=>{})}
      refresh();
    },()=>{});
    S.db.collection('users').onSnapshot(snap=>{S.roster=snap.docs.map(d=>d.id);resolveNames(S.roster);refresh()},()=>{});
  }
  const claimed=new Set();
  const sub=name=>S.db.collection(name).onSnapshot(snap=>{
    let arr=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(name==='events')arr=sortEvents(arr);
    else{
      const raw=arr;arr=raw.filter(vis);
      if(S.isOwner&&S.me.id)raw.forEach(x=>{const k=name+x.id;if(!x.ownerId&&!claimed.has(k)){claimed.add(k);save(name,x.id,{ownerId:S.me.id},{now:true})}});
      resolveNames(arr.map(x=>x.ownerId).concat(...arr.map(x=>x.sharedWith||[])));
    }
    S[name]=arr;S.loaded[name]=true;refresh();
  },e=>{toast('Storage error: '+errMsg(e))});
  sub('events');sub('contacts');sub('meetings');
  S.db.doc('settings/followup').onSnapshot(snap=>{S.tpl=snap.exists?snap.data():null},()=>{});
}
init();
})();
